<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoScrap AI – Smart E-Waste Collection & Recycling Platform</title>
  <meta name="description" content="EcoScrap AI: Smart E-Waste Collection & Recycling Platform connecting informal scrap dealers and waste collectors to authorized EPR recyclers in India.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#15803d">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EcoScrap AI">
</head>
<body>

  <!-- Full-Width Web Platform Container -->
  <div class="app-container">
    
    <!-- Top Sticky Header Navigation Bar -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand">
          <div class="brand-icon">♻️</div>
          <div class="brand-text">
            <h1 id="brandTitle">EcoScrap AI</h1>
            <p id="brandTagline">Smart E-Waste Collection & Recycling Platform</p>
          </div>
        </div>

        <!-- 7 Indian Languages Selector -->
        <div class="lang-selector-wrapper">
          <div class="lang-selector">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="hi">हिन्दी</button>
            <button class="lang-btn" data-lang="mr">मराठी</button>
            <button class="lang-btn" data-lang="ta">தமிழ்</button>
            <button class="lang-btn" data-lang="te">తెలుగు</button>
            <button class="lang-btn" data-lang="kn">ಕನ್ನಡ</button>
            <button class="lang-btn" data-lang="ml">മലയാളം</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Role Status & Logout Bar (Visible only when logged in) -->
    <div class="user-status-bar" id="userStatusBar" style="display: none;">
      <div class="role-tag" id="userRoleName">
        <!-- Injected dynamically -->
      </div>
      <div style="display: flex; align-items: center; gap: 14px;">
        <span id="userDetails" style="font-size: 13px; font-weight: 600; color: var(--text-muted);"></span>
        <button class="logout-btn" onclick="logoutUser()">
          🚪 <span id="logoutBtnLabel">Log Out</span>
        </button>
      </div>
    </div>

    <!-- Main Content Area (Expansive Responsive Web Grid) -->
    <main class="app-content" id="appContent">
      <!-- Injected by app.js: Login Portal or Role Dashboard -->
    </main>

    <!-- Website Footer -->
    <footer class="web-footer">
      <div>
        <strong>EcoScrap AI</strong> • Central Pollution Control Board (CPCB) & EPR E-Waste Rules 2022 Compliant Architecture.
      </div>
      <div>
        <button class="audio-btn" style="background:#1e293b; color:#38bdf8; border:1px solid #334155;" onclick="openSafetyModal()">
          🚨 Safety & Hazard Guide
        </button>
      </div>
    </footer>

  </div>

  <!-- Core Scripts -->
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
